name: P11-A Linux lock diagnostic
on:
  push:
    branches: [feature/p11a-reproducible-ci]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      WIREIT_CACHE: none
      WIREIT_LOGGER: simple
      SF_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
      - run: npm install --global yarn@1.22.22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '11.0.30+7'
      - name: Cold source evidence
        run: |
          node --version
          yarn --version
          test ! -e node_modules
          test -z "$(find packages -type d \( -name node_modules -o -name dist -o -name lib -o -name .wireit \) -print -quit)"
      - name: Diagnostic synchronization from existing lock, declarations unchanged
        run: node scripts/ci-run.mjs sync -- yarn install --non-interactive
      - name: Return public-registry lock data for review without repository write permission
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const data=fs.readFileSync('yarn.lock');
          if(data.length>2000000)throw new Error('Unexpected lock size');
          for(const m of data.toString().matchAll(/^  resolved "([^"]+)"/gm)){const u=new URL(m[1]);if(u.username||u.password)throw new Error('Unexpected URL userinfo');}
          const encoded=data.toString('base64');
          console.log('P11A_LOCK_BEGIN '+createHash('sha256').update(data).digest('hex')+' '+data.length);
          for(let i=0;i<encoded.length;i+=24000)console.log('P11A_LOCK_CHUNK '+(i/24000)+' '+encoded.slice(i,i+24000));
          console.log('P11A_LOCK_END');
          NODE
      - run: node scripts/ci-run.mjs lock -- yarn lock:check
      - run: node scripts/ci-run.mjs install -- yarn install --frozen-lockfile --non-interactive
      - name: Confirm all manifest declarations and scripts unchanged by installation
        run: git diff --exit-code -- package.json 'packages/*/package.json'
      - run: node scripts/ci-run.mjs build -- yarn build
      - run: node scripts/ci-run.mjs engineering --tests --no-skips -- yarn test:engineering
      - run: node scripts/ci-run.mjs default --tests -- yarn test
      - run: node scripts/ci-run.mjs analyzer-e2e --tests --no-skips -- yarn workspace @salesforce/mcp-provider-code-analyzer test:e2e
      - run: |
          yarn skill:validate
          yarn skill:check
          node scripts/ci-run.mjs skill --tests --no-skips -- yarn skill:test
          yarn agent:check
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11a-lock-diagnostic
          path: .temp/p11a-ci/
          include-hidden-files: true
          retention-days: 7
