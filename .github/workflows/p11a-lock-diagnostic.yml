name: P11-A pre-PR validation
on:
  push:
    branches: [feature/p11a-reproducible-ci]
permissions:
  contents: read
concurrency:
  group: p11a-pre-pr-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  linux-unit-tests:
    uses: ./.github/workflows/tempUnitTestsLinux.yml
  windows-unit-tests:
    uses: ./.github/workflows/tempUnitTestsWindows.yml
  pre-pr-gate:
    name: P11-A pre-PR gate
    if: always()
    needs: [linux-unit-tests, windows-unit-tests]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'for(const [name,job] of Object.entries(JSON.parse(process.env.RESULTS))){console.log(name+": "+job.result);if(job.result!=="success")process.exitCode=1;}'
