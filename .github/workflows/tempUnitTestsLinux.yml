# Local adaptation of Salesforce CLI's reusable unitTestsLinux workflow.
name: Linux cold build and tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  linux-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      WIREIT_CACHE: none
      WIREIT_LOGGER: simple
      SF_DISABLE_TELEMETRY: 'true'
      SFOA_DB_HOST: 127.0.0.1
      SFOA_DB_PORT: '3306'
      SFOA_DB_NAME: sfoa_enterprise_mcp_ci
      SFOA_DB_USER: root
      SFOA_DB_PASSWORD: p11a-ephemeral-ci-only
      SFOA_DB_SSL_MODE: disabled
    services:
      mysql:
        image: mysql:8.0.30
        env:
          MYSQL_ROOT_PASSWORD: p11a-ephemeral-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Yarn Classic 1.22.22
        run: npm install --global yarn@1.22.22
      - name: Java 11 for unchanged upstream PMD/analyzer fixtures
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11.0.30+7'
      - name: Toolchain and cold checkout evidence
        run: |
          node --version
          yarn --version
          java -version
          test ! -e node_modules
          test -z "$(find packages -type d \( -name node_modules -o -name dist -o -name lib -o -name .wireit \) -print -quit)"
          test -z "$(find packages -name '*.tsbuildinfo' -print -quit)"
      - name: Exact root/workspace lock selector coverage
        run: node scripts/ci-run.mjs lock -- yarn lock:check
      - name: Frozen install
        run: node scripts/ci-run.mjs install -- yarn install --frozen-lockfile --non-interactive
      - name: Verify install does not modify manifests or lock
        run: git diff --exit-code -- package.json 'packages/*/package.json' yarn.lock
      - name: Build every workspace
        id: build
        run: node scripts/ci-run.mjs build -- yarn build
      - name: Build orchestration and CI evidence tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs engineering --tests --no-skips -- yarn test:engineering
      - name: Original default workspace tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs default --tests -- yarn test
      - name: P3 suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs p3 --tests --no-skips -- yarn workspace @sfoa/mcp-server test:p3
      - name: P4 suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs p4 --tests --no-skips -- yarn workspace @sfoa/mcp-server test:p4
      - name: P5 suite including fake Salesforce and real MySQL runtime
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs p5 --tests --no-skips -- yarn workspace @sfoa/mcp-server test:p5
      - name: P7 suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs p7 --tests --no-skips -- yarn workspace @sfoa/mcp-server test:p7
      - name: Control Plane real MySQL integration (must execute)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs control-plane-mysql --tests --no-skips -- yarn workspace @sfoa/control-plane test:mysql
      - name: MCP real MySQL integration (must execute)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs runtime-mysql --tests --no-skips -- yarn p5:test:runtime:mysql
      - name: Install manifest-pinned Playwright Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node packages/sfoa-admin-web/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Admin browser E2E with mocked Salesforce/Admin fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs admin-browser --tests --no-skips -- yarn p5:e2e
      - name: Real Admin API and temporary MySQL fullstack E2E
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs admin-fullstack --tests --no-skips -- yarn p5:e2e:fullstack
      - name: Original stdio compatibility regression (no real Org)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs stdio -- yarn workspace @sfoa/runtime-validation regress:stdio
      - name: Official Tool compatibility regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs upstream-contract -- yarn workspace @sfoa/mcp-server validate:upstream
      - name: Skill and Agent generated artifacts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          yarn skill:validate
          yarn skill:check
          yarn skill:delivery
          node scripts/ci-run.mjs skill --tests --no-skips -- yarn skill:test
          yarn skill:smoke
          yarn agent:check
          git diff --exit-code
      - name: Preserve bounded redacted reports on success and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p11a-linux-${{ github.sha }}
          path: .temp/p11a-ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
