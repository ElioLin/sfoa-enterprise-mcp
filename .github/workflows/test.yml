name: tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: p11a-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-unit-tests:
    uses: ./.github/workflows/tempUnitTestsLinux.yml
  windows-unit-tests:
    uses: ./.github/workflows/tempUnitTestsWindows.yml
  p11a-gate:
    name: P11-A gate
    if: always()
    needs: [linux-unit-tests, windows-unit-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both complete cold-build and test jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(jobs)){ console.log(name+": "+job.result); if(job.result!=="success")process.exitCode=1; }'
