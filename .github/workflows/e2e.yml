name: opt-in real Org E2E
on:
  workflow_dispatch:
    inputs:
      confirm-test-org:
        description: 'I configured an isolated test Org in the sfoa-test-org environment; never production.'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  real-org-e2e:
    if: inputs.confirm-test-org
    environment: sfoa-test-org
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        provider: [mcp-provider-dx-core, mcp-provider-code-analyzer]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SF_DISABLE_TELEMETRY: 'true'
      WIREIT_CACHE: none
      WIREIT_LOGGER: simple
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11.0.30+7'
      - name: Explicit Windows package-script shell
        if: runner.os == 'Windows'
        run: echo 'npm_config_script_shell=C:\Program Files\Git\bin\bash.exe' >> "$GITHUB_ENV"
      - name: Require isolated test credentials without displaying them
        env:
          TESTKIT_AUTH_URL: ${{ secrets.TESTKIT_AUTH_URL }}
        run: |
          node -e 'if(!process.env.TESTKIT_AUTH_URL){console.error("NOT_CONFIGURED: isolated test Org credentials");process.exit(1)}'
      - name: Fixed engineering tools
        run: |
          npm install --global yarn@1.22.22 @salesforce/cli@2.148.3
          yarn install --frozen-lockfile --non-interactive
          yarn build
      - name: Unchanged official provider real Org E2E
        env:
          PROVIDER: ${{ matrix.provider }}
          TESTKIT_AUTH_URL: ${{ secrets.TESTKIT_AUTH_URL }}
          TESTKIT_HUB_USERNAME: ${{ secrets.TESTKIT_HUB_USERNAME }}
          TESTKIT_JWT_CLIENT_ID: ${{ secrets.TESTKIT_JWT_CLIENT_ID }}
          TESTKIT_JWT_KEY: ${{ secrets.TESTKIT_JWT_KEY }}
          TESTKIT_HUB_INSTANCE: ${{ secrets.TESTKIT_HUB_INSTANCE }}
        run: yarn --cwd "packages/$PROVIDER" test:e2e
