# Local adaptation; Git Bash keeps the original analyzer cp resource-copy steps intact.
name: Windows cold build and tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  windows-unit-tests:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      P11A_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WIREIT_CACHE: none
      WIREIT_LOGGER: simple
      SF_DISABLE_TELEMETRY: 'true'
      npm_config_script_shell: 'C:\Program Files\Git\bin\bash.exe'
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Yarn Classic 1.22.22
        run: npm install --global yarn@1.22.22
      - name: Java 11 for unchanged upstream PMD/analyzer fixtures
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11.0.30+7'
      - name: Toolchain and cold checkout evidence
        run: |
          node --version
          yarn --version
          java -version
          test ! -e node_modules
          test -z "$(find packages -type d \( -name node_modules -o -name dist -o -name lib -o -name .wireit \) -print -quit)"
          test -z "$(find packages -name '*.tsbuildinfo' -print -quit)"
      - name: Exact root/workspace lock selector coverage
        run: node scripts/ci-run.mjs lock -- yarn lock:check
      - name: Frozen install
        run: node scripts/ci-run.mjs install -- yarn install --frozen-lockfile --non-interactive
      - name: Verify install does not modify manifests or lock
        run: git diff --exit-code -- package.json 'packages/*/package.json' yarn.lock
      - name: Build every workspace with original resource copying
        id: build
        run: node scripts/ci-run.mjs build -- yarn build
      - name: Build orchestration and CI evidence tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs engineering --tests --no-skips -- yarn test:engineering
      - name: Original default workspace tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs default --tests -- yarn test
      - name: Original analyzer local E2E (Java fixtures, no Salesforce Org)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci-run.mjs analyzer-e2e --tests --no-skips -- yarn workspace @salesforce/mcp-provider-code-analyzer test:e2e
      - name: Skill and Agent generated artifacts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          yarn skill:validate
          yarn skill:check
          node scripts/ci-run.mjs skill --tests --no-skips -- yarn skill:test
          yarn agent:check
          git diff --exit-code
      - name: Preserve bounded redacted reports on success and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p11a-windows-${{ github.sha }}
          path: .temp/p11a-ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
