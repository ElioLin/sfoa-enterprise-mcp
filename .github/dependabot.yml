version: 2
updates:
  - package-ecosystem: 'npm'
    # One Yarn Classic workspace graph and one shared root lockfile, including all packages/*.
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
    versioning-strategy: 'increase'
    labels:
      - 'dependencies'
    # Pause routine version PRs during P11; security updates use a separate GitHub limit.
    open-pull-requests-limit: 0
    pull-request-branch-name:
      separator: '-'
    commit-message:
      # cause a release for non-dev-deps
      prefix: fix(deps)
      # no release for dev-deps
      prefix-development: chore(dev-deps)
    ignore:
      - dependency-name: '@salesforce/dev-scripts'
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    groups:
      actions-patch-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']
